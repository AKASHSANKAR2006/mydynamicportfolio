<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Me</title>
    <style>/* Reset */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

/* Body */
body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#4facfe,#00f2fe);
    padding:20px;
}

/* Container */
.container{
    width:100%;
    max-width:700px;
}

/* Card */
.about-card{
    background:#fff;
    padding:40px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 15px 35px rgba(0,0,0,0.2);
    transition:.4s;
}

.about-card:hover{
    transform:translateY(-8px);
}

/* Heading */
.about-card h1{
    color:#0077ff;
    margin-bottom:20px;
    font-size:2.5rem;
}

/* Paragraph */
.about-card p{
    color:#555;
    line-height:1.8;
    font-size:18px;
    margin-bottom:20px;
}

/* Highlight */
.about-card span{
    color:#0077ff;
    font-weight:bold;
}

/* Button */
.btn{
    display:inline-block;
    text-decoration:none;
    background:#0077ff;
    color:white;
    padding:14px 28px;
    border-radius:30px;
    transition:.3s;
    font-weight:bold;
}

.btn:hover{
    background:#0056d6;
    transform:scale(1.05);
    box-shadow:0 8px 20px rgba(0,119,255,.4);
}

/* Mobile */
@media(max-width:768px){

    .about-card{
        padding:30px 20px;
    }

    .about-card h1{
        font-size:2rem;
    }

    .about-card p{
        font-size:16px;
    }

    .btn{
        width:100%;
        padding:15px;
    }

}</style>

</head>
<body>

<div class="container">
    <div class="about-card">
        <h1>👋 About Me</h1>

        <p>
            Hello! I'm a passionate student with a strong interest in
            <span>Python</span>,
            <span>Flask</span>,
            <span>Web Development</span>,
            <span>Artificial Intelligence</span>, and
            <span>Database Management</span>.
        </p>

        <p>
            I enjoy building real-world projects, learning new technologies,
            and improving my programming skills every day.
        </p>

        <a href="/" class="btn">🏠 Back Home</a>
    </div>
</div>

</body>
</html>
