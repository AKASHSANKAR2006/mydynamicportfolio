<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Contact Form</title>
<style>
    *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:linear-gradient(-45deg,#6a11cb,#2575fc,#00c9ff,#92fe9d);
    background-size:400% 400%;
    animation:bgAnimation 12s ease infinite;
}

@keyframes bgAnimation{
    0%{
        background-position:0% 50%;
    }
    50%{
        background-position:100% 50%;
    }
    100%{
        background-position:0% 50%;
    }
}

.container{
    width:90%;
    max-width:450px;
    padding:35px;
    border-radius:20px;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(15px);
    box-shadow:0 15px 35px rgba(0,0,0,.25);
    animation:fadeUp 1s ease;
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(40px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.container h2{
    text-align:center;
    color:#fff;
    margin-bottom:30px;
    font-size:30px;
}

.inputBox{
    position:relative;
    margin-bottom:25px;
}

.inputBox input,
.inputBox textarea{
    width:100%;
    padding:15px;
    border:2px solid rgba(255,255,255,.4);
    background:transparent;
    outline:none;
    border-radius:12px;
    color:#fff;
    font-size:16px;
    transition:.4s;
}

.inputBox textarea{
    resize:none;
    height:120px;
}

.inputBox label{
    position:absolute;
    left:15px;
    top:15px;
    color:#eee;
    pointer-events:none;
    transition:.3s;
}

.inputBox input:focus,
.inputBox textarea:focus,
.inputBox input:valid,
.inputBox textarea:valid{
    border-color:#00ffd5;
    box-shadow:0 0 15px rgba(0,255,213,.5);
}

.inputBox input:focus~label,
.inputBox input:valid~label,
.inputBox textarea:focus~label,
.inputBox textarea:valid~label{
    top:-10px;
    left:12px;
    background:#00ffd5;
    color:#000;
    padding:2px 8px;
    border-radius:20px;
    font-size:12px;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:50px;
    background:#00ffd5;
    color:#111;
    font-size:18px;
    cursor:pointer;
    font-weight:bold;
    transition:.4s;
}

button:hover{
    transform:translateY(-4px) scale(1.03);
    box-shadow:0 12px 25px rgba(0,255,213,.5);
}

button:active{
    transform:scale(.96);
}

@media(max-width:500px){

    .container{
        padding:25px;
    }

    .container h2{
        font-size:24px;
    }

}
</style>
    <!-- External CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='contact.css') }}">
</head>

<body>

<div class="container">

    <h2>Contact Us</h2>

    <form method="POST">

        <div class="inputBox">
            <input type="text" name="name" required>
            <label>Name</label>
        </div>

        <div class="inputBox">
            <input type="email" name="email" required>
            <label>Email</label>
        </div>

        <div class="inputBox">
            <textarea name="message" required></textarea>
            <label>Message</label>
        </div>

        <button type="submit">🚀 Send Message</button>

    </form><br>
    E-MAIL :abc@gmail.com<br>
    PHONE  :00000000000
</div>

</body>
</html>
